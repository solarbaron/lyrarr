name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      # The tests import the Flask app, SQLAlchemy models, mutagen etc., so
      # install the exact dependency set the Docker image ships
      # (requirements.lock), then the test/lint tools on top.
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Check version strings agree
        run: |
          python - <<'EOF'
          import json, re, sys, tomllib
          versions = {
              'pyproject.toml': tomllib.load(open('pyproject.toml', 'rb'))['project']['version'],
              'lyrarr/__init__.py': re.search(r"__version__\s*=\s*['\"]([^'\"]+)", open('lyrarr/__init__.py').read()).group(1),
              'frontend/package.json': json.load(open('frontend/package.json'))['version'],
          }
          print(versions)
          if len(set(versions.values())) != 1:
              sys.exit('Version mismatch — bump all of: ' + ', '.join(versions))
          EOF

      - name: Lint
        run: ruff check lyrarr tests

      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm run build` first runs the theme guardrails (prebuild → `npm run check`:
      # scripts/check-themes.mjs contrast/hue/token checks and scripts/check-colors.mjs,
      # which fails on purple, gradients, palette colour names and colour literals in
      # page code), then type-checks (tsc) and writes the production bundle to
      # lyrarr/frontend, which is committed so `python -m lyrarr` works from a
      # plain checkout.
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Committed build is up to date
        run: |
          if ! git diff --exit-code --stat -- lyrarr/frontend \
             || [ -n "$(git status --porcelain --untracked-files=all -- lyrarr/frontend)" ]; then
            echo "::error::lyrarr/frontend is stale — run 'cd frontend && npm run build' and commit the result."
            git status --short -- lyrarr/frontend
            exit 1
          fi

  docker:
    # Publishing happens in docker-publish.yml on tags/releases; this only
    # proves the image still builds.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
