name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*'          # v-prefixed tags like v1.2.3
      - '[0-9]*'      # plain version tags like 1.5, 1.6.0
  release:
    types: [published]
  workflow_dispatch:    # Allows manual trigger from GitHub UI

# Creating a GitHub release for a new tag fires both the tag-push and the
# release event; collapse them into a single build per ref.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. solarbaron/lyrarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write     # Required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # At least one rule below must match every trigger, or the build fails
      # with "tag is needed when pushing to registry":
      #  - tag pushes/releases: the tag name verbatim (handles 1.5-style tags
      #    that strict semver parsing rejects) + normalized pep440 variants
      #  - manual dispatch from a branch: the branch name, plus :latest on main
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
