name: Build & Publish Docker Image

on:
  push:
    tags:
      - 'v*'          # v-prefixed tags like v1.2.3
      - '[0-9]*'      # plain version tags like 1.5, 1.6.0
  release:
    types: [published]
  workflow_dispatch:    # Allows manual trigger from GitHub UI

# Creating a GitHub release for a new tag fires both the tag-push and the
# release event; collapse them into a single build per ref.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. solarbaron/lyrarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write     # Required to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags, to tell whether this is the newest release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decide whether this build may move :latest. Only the newest *stable*
      # version tag qualifies — not a pre-release (1.7-rc1, 2.0.0b1, or a tag
      # whose GitHub release is marked pre-release) and not an older line
      # (e.g. a 1.5.4 hotfix tagged after 1.6.0). Computed here rather than
      # with metadata-action's latest=auto, which only checks the pre-release
      # part. Also yields the version string baked into the image.
      - name: Resolve version / latest
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_latest=false
          version=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            stable='^v?[0-9]+(\.[0-9]+)*$'
            if echo "$tag" | grep -Eq "$stable"; then
              prerelease=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.prerelease or .draft' 2>/dev/null) || prerelease=false
              git fetch --force --tags --quiet origin
              newest=$(git tag --list | grep -E "$stable" | sed 's/^v//' | sort -V | tail -n 1)
              if [ "$prerelease" != "true" ] && [ "$version" = "$newest" ]; then
                is_latest=true
              fi
              echo "tag=$tag newest-stable=$newest github-prerelease=$prerelease"
            fi
          fi
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest: $is_latest, version: ${version:-<package default>}"

      # At least one rule below must match every trigger, or the build fails
      # with "tag is needed when pushing to registry":
      #  - tag pushes/releases: the tag name verbatim (handles 1.5-style tags
      #    that strict semver parsing rejects) + normalized pep440 variants
      #    (pep440 skips {{major}}.{{minor}} for pre-releases)
      #  - manual dispatch from a branch: the branch name, plus :latest on main
      # latest=false: :latest comes only from the explicit rules below.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            LYRARR_VERSION=${{ steps.version.outputs.version }}
