<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lyrarr - Lidarr Companion for Music Metadata Management" />
    <meta name="theme-color" content="#0b0c0d" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4b740'/%3E%3Crect x='8' y='10' width='16' height='2.6' rx='1.3' fill='%231c1204'/%3E%3Crect x='8' y='15' width='12' height='2.6' rx='1.3' fill='%231c1204'/%3E%3Crect x='8' y='20' width='8' height='2.6' rx='1.3' fill='%231c1204'/%3E%3Ccircle cx='22' cy='21.3' r='2.3' fill='%231c1204'/%3E%3C/svg%3E" />
    <title>Lyrarr</title>
    <!-- Pre-paint theme (DESIGN.md 2.6): same resolution as src/theme/ThemeProvider.tsx.
         B must equal {id: [scheme, --ly-bg, --ly-nav]} from src/theme/themes.ts (scripts/check-themes.mjs asserts it). -->
    <script>
      (function () { try {
        var B = { afterhours:['dark','#0f1012','#0b0c0d'], lowtide:['dark','#0c1524','#08101c'], greenroom:['dark','#0b1712','#07110d'],
                  oxblood:['dark','#190f0d','#120a08'], linernotes:['light','#f5f2ec','#ece6dc'], daylight:['light','#f2f4f7','#ffffff'],
                  signal:['dark','#000000','#000000'], broadsheet:['light','#ffffff','#f1f1f1'] };
        var s = localStorage, p = s.getItem('lyrarr-theme');
        if (p === 'dark') p = 'afterhours'; else if (p === 'light') p = 'linernotes';
        if (!B[p]) {
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var k = s.getItem(dark ? 'lyrarr-theme-dark' : 'lyrarr-theme-light');
          p = (B[k] && B[k][0] === (dark ? 'dark' : 'light')) ? k : (dark ? 'afterhours' : 'linernotes');
        }
        var r = document.documentElement;
        r.setAttribute('data-theme', p); r.setAttribute('data-mantine-color-scheme', B[p][0]);
        r.style.colorScheme = B[p][0]; r.style.backgroundColor = B[p][1];
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', B[p][2]);
      } catch (e) {} })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
